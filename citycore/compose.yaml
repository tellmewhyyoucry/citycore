services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: citycore
      MARIADB_USER: citycore
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run npm run setup}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run npm run setup}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - citycore_db:/var/lib/mysql
      - ./scripts/docker-init.sh:/docker-entrypoint-initdb.d/01-test-db.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    profiles: [extras]
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  api:
    build: .
    profiles: [backend]
    env_file: .env
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      API_HOST: 0.0.0.0
      API_PORT: 3100
      REDIS_URL: ""
    ports: ["127.0.0.1:3100:3100"]
    depends_on:
      mariadb:
        condition: service_healthy
volumes:
  citycore_db:
